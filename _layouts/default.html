<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- PWA -->
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/icon.svg' | relative_url }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="echocc00">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {%- if page.url == '/' %}
  <link rel="preload" as="image" href="data:,">
  {%- endif %}
</head>
<body>
  {%- include header.html -%}
  <main>
    {{ content }}
  </main>
  {%- include footer.html -%}
  {%- if page.url == '/projects/' or page.url == '/projects' %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {%- endif %}
</body>
</html>
