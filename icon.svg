<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable PWA icon for echocc00.
    Safe zone: center 80% (radius ≈ 205px from center 256,256).
    All critical content fits inside the inner 80% circle.
    Outer 10% (transparent border) may be masked away by Android/iOS.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background fills entire 512x512 (safe to be masked) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Grid pattern: subtle, low opacity, inside safe zone -->
  <g opacity="0.12">
    <line x1="80" y1="80" x2="432" y2="80" stroke="#22d3ee" stroke-width="1"/>
    <line x1="80" y1="160" x2="432" y2="160" stroke="#22d3ee" stroke-width="1"/>
    <line x1="80" y1="240" x2="432" y2="240" stroke="#22d3ee" stroke-width="1"/>
    <line x1="80" y1="320" x2="432" y2="320" stroke="#22d3ee" stroke-width="1"/>
    <line x1="80" y1="432" x2="432" y2="432" stroke="#22d3ee" stroke-width="1"/>
    <line x1="80" y1="80" x2="80" y2="432" stroke="#22d3ee" stroke-width="1"/>
    <line x1="160" y1="80" x2="160" y2="432" stroke="#22d3ee" stroke-width="1"/>
    <line x1="240" y1="80" x2="240" y2="432" stroke="#22d3ee" stroke-width="1"/>
    <line x1="320" y1="80" x2="320" y2="432" stroke="#22d3ee" stroke-width="1"/>
    <line x1="432" y1="80" x2="432" y2="432" stroke="#22d3ee" stroke-width="1"/>
  </g>

  <!--
    All major content within inner 80% safe zone (102-410 x, 102-410 y).
    Center: 256,256. Safe radius: ~205.
  -->

  <!-- Central shield (security) - INSIDE safe zone -->
  <path d="M 256 152 L 360 192 L 360 290 Q 360 350 256 392 Q 152 350 152 290 L 152 192 Z"
        fill="none" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner circuit lines (centered) -->
  <g stroke="#22d3ee" stroke-width="5" fill="none" opacity="0.95">
    <path d="M 200 240 L 256 240 L 280 264 L 256 288 L 200 288"/>
    <path d="M 200 312 L 256 312 L 312 312"/>
    <path d="M 256 288 L 256 312"/>
    <circle cx="312" cy="312" r="8" fill="#22d3ee"/>
  </g>

  <!-- Small "e" mark in center-bottom (INSIDE safe zone, < 40px from center) -->
  <g transform="translate(256, 320)">
    <!-- No "e" — too cluttered with shield. Keep clean. -->
  </g>

  <!-- Pulse dot - top right, INSIDE safe zone -->
  <circle cx="384" cy="152" r="14" fill="#34d399"/>
</svg>