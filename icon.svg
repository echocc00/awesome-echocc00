<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- Grid pattern -->
  <g opacity="0.15">
    <line x1="0" y1="64" x2="512" y2="64" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="192" x2="512" y2="192" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="448" x2="512" y2="448" stroke="#22d3ee" stroke-width="1"/>
    <line x1="64" y1="0" x2="64" y2="512" stroke="#22d3ee" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#22d3ee" stroke-width="1"/>
    <line x1="192" y1="0" x2="192" y2="512" stroke="#22d3ee" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#22d3ee" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="512" stroke="#22d3ee" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#22d3ee" stroke-width="1"/>
    <line x1="448" y1="0" x2="448" y2="512" stroke="#22d3ee" stroke-width="1"/>
  </g>

  <!-- Central shield (security) -->
  <path d="M 256 96 L 384 144 L 384 280 Q 384 360 256 416 Q 128 360 128 280 L 128 144 Z"
        fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner circuit-like lines -->
  <g stroke="#22d3ee" stroke-width="4" fill="none" opacity="0.9">
    <path d="M 192 200 L 256 200 L 280 224 L 256 248 L 192 248"/>
    <path d="M 192 280 L 256 280 L 320 280"/>
    <path d="M 256 248 L 256 280"/>
    <circle cx="320" cy="280" r="8" fill="#22d3ee"/>
  </g>

  <!-- Small "e" mark in the corner -->
  <g transform="translate(384, 384)">
    <circle r="48" fill="#020617" stroke="#22d3ee" stroke-width="3"/>
    <text x="0" y="14" font-family="monospace" font-size="48" font-weight="700"
          text-anchor="middle" fill="#22d3ee">e</text>
  </g>

  <!-- Pulse dot top-right -->
  <circle cx="416" cy="96" r="12" fill="#34d399"/>
</svg>