# Jekyll configuration for echocc00.github.io/awesome-echocc00
title: echocc00 · Project Portfolio
description: Portfolio & project index for @echocc00 — Cloud Security, Network Engineering, AI-Driven SecOps

theme: minima

# Exclude from Jekyll processing
exclude:
  - SECURITY.md
  - CODEOWNERS
  - LICENSE
  - release-drafter.yml
  - .github/

# Include non-standard files (PWA assets must be present as-is)
include:
  - sw.js
  - manifest.webmanifest
  - icon.svg

show_downloads: false
