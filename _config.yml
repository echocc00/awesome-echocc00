title: "echocc00 — Security & Network Engineering Portfolio"
description: "AI-driven security infrastructure. Cloud security, network engineering, and AI-driven SecOps. Apache-2.0."
author: echocc00
url: ""
baseurl: ""
timezone: Asia/Shanghai

# Build
# (no global permalink override — let pages use their own explicit permalinks)
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - SECURITY.md
  - CODEOWNERS
  - LICENSE
  - release-drafter.yml
  - .github/
  - node_modules/
  - vendor/
  - Gemfile.lock
  - sw.js
  - manifest.webmanifest
  - icon.svg

# Treat non-standard files as-is (PWA assets must reach _site unchanged).
include:
  - sw.js
  - manifest.webmanifest
  - icon.svg

show_downloads: false

# Defaults applied to every page via the `default` frontmatter merge.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: "projects"
      type: pages
    values:
      layout: default

# Collections: project detail pages render under /projects/<slug>/
collections:
  projects:
    output: true
    permalink: /projects/:name/

sass:
  quiet_deps: true
