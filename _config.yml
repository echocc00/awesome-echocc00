# Jekyll configuration for echocc00.github.io/awesome-echocc00
title: echocc00 · Project Portfolio
description: Portfolio & project index for @echocc00 — Cloud Security, Network Engineering, AI-Driven SecOps

theme: minima

# Exclude from Jekyll processing (won't be in output site)
exclude:
  - SECURITY.md
  - CODEOWNERS
  - LICENSE
  - release-drafter.yml
  - .github/

# Include files that would otherwise be excluded (e.g., PWA assets)
include:
  - sw.js
  - manifest.webmanifest

show_downloads: false