# Project data — single source of truth.
# Each entry below powers:
#   - the project list page (/projects/)
#   - the project detail page (/projects/<slug>/)
#   - the homepage product card grid
#
# `slug` must match the markdown file name in `projects/<slug>.md`.

projects:

  - slug: secsight
    name: SecSight
    cover:
      icon: 🛡
      gradient: "linear-gradient(135deg, #1e3a8a 0%, #000 100%)"
    tagline: "AI-driven SOC platform"
    category: security
    short_desc: "SecOps Copilot + auto-remediation SOAR engine for small-to-mid SOC teams."
    description: |
      SecSight is an AI-driven security operations platform built for small-and-mid SOC teams
      that don't have the headcount to staff a 24/7 detection and response function. It pairs
      a multi-agent SecOps Copilot with an auto-remediation SOAR engine so routine incidents
      — phishing triage, false-positive sweep, IOC enrichment — are handled automatically
      under well-defined autonomy levels, while the complex ones land in a human review queue.
      The system ships with a process-isolated deployment model and is aligned with MLPS 2.0
      (等保 2.0) so it can be installed in regulated environments without architectural
      rewrites.
    metrics:
      - "22 production playbooks"
      - "5 autonomy levels"
      - "234 tests · 87.8% coverage"
    tech_stack:
      - lang: Python
        role: Core service
      - lang: TypeScript
        role: Console SPA
      - lang: Rust
        role: Process sandbox
    integrations:
      - Wazuh
      - Suricata
      - Shuffle
      - OpenCTI
      - DFIR-IRIS
    version: v0.5.1
    license: Apache-2.0
    repo: echocc00/SecSight
    has_detail_page: true
    features:
      - title: "AI SecOps Copilot"
        desc: "Multi-agent SOC assistant over SIEM/ticket/KB."
      - title: "Auto-remediation SOAR"
        desc: "22 production playbooks across 5 autonomy levels."
      - title: "Four-layer knowledge base"
        desc: "Process-isolated; aligned with MLPS 2.0 (等保 2.0)."
      - title: "MCP & LiteLLM"
        desc: "Pluggable LLM backend, MCP tool bus, Qdrant RAG."

  - slug: secopent
    name: SecOpent
    cover:
      icon: 🔐
      gradient: "linear-gradient(135deg, #7c2d12 0%, #0f172a 100%)"
    tagline: "Authorized pentest workbench"
    category: security
    short_desc: "Catalog-driven, agent-native authorized pentest workbench."
    description: |
      SecOpent is an authorized pentest workbench for red, blue, and purple teams that need
      to coordinate penetration testing across many assets without losing control of the blast
      radius. The agent never runs anything on its own — every action is a proposal that an
      operator approves through a deterministic case-DSL workflow. The workbench ships with
      17 cross-asset adapters (web / network / cloud) and a CoverageMatrix so you can see
      which surfaces have been probed and which haven't.
    metrics:
      - "17 adapters"
      - "CoverageMatrix"
      - "YAML case DSL"
    tech_stack:
      - lang: Python
        role: Backend
      - lang: TypeScript
        role: Case Studio UI
    integrations: []
    version: v1.1.1-stable
    license: Apache-2.0
    repo: echocc00/SecOpent
    has_detail_page: true
    features:
      - title: "Catalog-driven"
        desc: "YAML DSL for cases; deterministic + humans approve."
      - title: "Multi-asset coverage"
        desc: "web / network / cloud adapters with CoverageMatrix."
      - title: "Three-layer evidence"
        desc: "oracle N/N, seccomp sandbox, desensitized output."

  - slug: vidslice
    name: VidSlice
    cover:
      icon: 🎬
      gradient: "linear-gradient(135deg, #6d28d9 0%, #1e1b4b 100%)"
    tagline: "OpenCut materials · vector index"
    category: content
    short_desc: "Third-party material vector indexing + Ed25519 attestation."
    description: |
      VidSlice is the material-side companion to OpenCut v3. The pain it solves is simple:
      when you ingest third-party clips into a video pipeline, you need to know what you've
      actually got and you need cryptographic proof that the asset hasn't been swapped mid-
      pipeline. VidSlice extracts three frames per clip, computes embeddings into a LanceDB
      index, attaches an Ed25519 signature at ingest time, and exposes an HTTP API so other
      tools (including OpenCut itself) can query the index without scraping anything.
    metrics:
      - "408 tests"
      - "LanceDB storage"
      - "3-frame extraction"
    tech_stack:
      - lang: Python
        role: Indexer & HTTP API
    integrations: []
    version: v0.7.10
    license: Apache-2.0
    repo: echocc00/VidSlice
    has_detail_page: true
    features:
      - title: "Vector index"
        desc: "LanceDB over multi-frame embeddings."
      - title: "Ed25519 attestation"
        desc: "Signed material provenance at ingest."
      - title: "NDJSON progress"
        desc: "Parallel ingestion with streamable events."

  - slug: netsage
    name: NetSage
    cover:
      icon: 🌐
      gradient: "linear-gradient(135deg, #047857 0%, #052e16 100%)"
    tagline: "AI network engineer"
    category: network
    short_desc: "AI-driven design, config generation, troubleshooting, and audit."
    description: |
      NetSage is the project I'd build if every network team had a senior engineer on call
      for every change. It accepts a plain-English request, drafts the configuration across
      five vendor syntaxes (Huawei VRP / Cisco IOS-XE / H3C / Juniper / Arista), validates
      the change inside Containerlab, runs Batfish for ACL and routing analysis, and waits
      for a human approve before it ever touches production. If the change breaks something,
      the snapshot rolls back. The whole loop is observable, auditable, and reversible.
    metrics:
      - "8 specialized agents"
      - "30 baseline rules"
      - "5-level RBAC"
    tech_stack:
      - lang: Python
        role: Backend
      - lang: TypeScript
        role: Operator UI
    integrations:
      - Containerlab
      - Batfish
      - NetBox
      - Nautobot
      - Huawei VRP
      - Cisco IOS-XE
      - H3C
      - Juniper
      - Arista
    version: v0.1.1
    license: Apache-2.0
    repo: echocc00/NetSage
    has_detail_page: true
    features:
      - title: "Three-gate engine"
        desc: "Containerlab simulation → Batfish validation → human approval + snapshot rollback."
      - title: "Multi-vendor"
        desc: "Huawei VRP / Cisco IOS-XE / H3C / Juniper / Arista."
      - title: "Source of truth"
        desc: "NetBox + Nautobot dual adapters."
      - title: "Compliance audit"
        desc: "30 baseline rules (CIS + vendor hardening) + ACL analysis."

  - slug: opencut002
    name: OpenCut v3
    cover:
      icon: ✂️
      gradient: "linear-gradient(135deg, #c2410c 0%, #1c1917 100%)"
    tagline: "Multi-domain short-video platform"
    category: content
    short_desc: "AI short-video production from still inputs to 1080x1920 vertical."
    description: |
      OpenCut v3 is an end-to-end AI short-video pipeline for content teams that need
      scale but don't have a multi-week post-production budget. Given a topic, a domain
      preset (education / travel / knowledge_paid / custom), and an input image, the
      pipeline runs 20 stages — research, script, voice, visuals, edit, BGM, captions,
      render — and outputs a 1080×1920 vertical video. CLI mode is for batch jobs;
      SaaS mode is for one-offs.
    metrics:
      - "20-stage pipeline"
      - "4 domains"
      - "CLI + SaaS"
    tech_stack:
      - lang: Python
        role: Pipeline
      - lang: TypeScript
        role: SaaS UI
    integrations: []
    version: v0.6.5
    license: Apache-2.0
    repo: echocc00/opencut002
    has_detail_page: true
    features:
      - title: "Domain presets"
        desc: "education / travel / knowledge_paid / custom."
      - title: "TTS + Remotion"
        desc: "Speech, auto-subtitles, BGM matching."
      - title: "Dual distribution"
        desc: "CLI for batch; SaaS for one-off."

  - slug: hydro-fork
    name: Hydro OJ
    cover:
      icon: 📚
      gradient: "linear-gradient(135deg, #2563eb 0%, #0c4a6e 100%)"
    tagline: "Hydro fork · OI judge platform"
    category: fork
    short_desc: "Active fork of [hydro-dev/Hydro](https://github.com/hydro-dev/Hydro). TypeScript."
    description: |
      Hydro OJ is the de facto open-source judge platform for informatics olympiad
